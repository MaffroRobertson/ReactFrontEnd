version: "3.8"

services:
  frontend:
    image: node:18-alpine
    working_dir: /app
    volumes:
      - ./:/app:cached
      - /app/node_modules
    command: sh -c "npm ci --silent && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173" # Vite default dev server port
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_URL=http://api:3000
    depends_on:
      - api
    restart: unless-stopped
