version: "3.8"

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Set VITE_API_URL at build time; defaults to the internal Docker service name "api" on port 8080
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    image: reactproject1_frontend:latest
    ports:
      - "3000:80" # map container nginx:80 to host 3000 for convenience
    depends_on:
      - api
    restart: unless-stopped
